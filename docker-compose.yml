services:
  postgres:
    image: postgres:16-alpine
    container_name: kodekspracy-postgres
    environment:
      POSTGRES_USER: kodeks
      POSTGRES_PASSWORD: kodeks
      POSTGRES_DB: kodekspracy
    ports:
      - "5432:5432"
    volumes:
      - kodekspracy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodeks -d kodekspracy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kodekspracy_pgdata:
